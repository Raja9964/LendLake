version: 2

models:
  - name: stg_branches
    description: Latest branch master record per branch, codes and regions normalised.
    columns:
      - name: branch_code
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ["SOUTH", "WEST", "NORTH", "EAST"]

  - name: stg_customers
    description: Latest version of each customer; cities conformed, phone normalised, PAN hashed.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mobile_number is null or length(mobile_number) = 10"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F", "U"]
      - name: employment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["SALARIED", "SELF_EMPLOYED"]
      - name: updated_at
        data_tests: [not_null]

  - name: stg_loan_applications
    description: Latest state per application (pending applications are re-sent once decided).
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: branch_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_branches')
                field: branch_code
      - name: product_code
        data_tests:
          - relationships:
              arguments:
                to: ref('products')
                field: product_code
      - name: application_date
        data_tests: [not_null]
      - name: application_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["PENDING", "APPROVED", "REJECTED", "WITHDRAWN"]

  - name: stg_sanctions
    columns:
      - name: sanction_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests: [unique, not_null]
      - name: sanctioned_amount
        data_tests: [not_null]
      - name: interest_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 5
                max_value: 30

  - name: stg_disbursements
    columns:
      - name: disbursement_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_sanctions')
                field: loan_id
      - name: disbursement_date
        data_tests: [not_null]
      - name: disbursed_amount
        data_tests: [not_null, not_negative]

  - name: stg_emi_schedule
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [loan_id, installment_no]
    columns:
      - name: due_date
        data_tests: [not_null]
      - name: emi_amount
        data_tests: [not_null, not_negative]

  - name: stg_repayments
    description: One row per payment attempt after de-duplication; flags rows that arrived a batch late.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_disbursements')
                field: loan_id
      - name: payment_date
        data_tests: [not_null]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["SUCCESS", "BOUNCED"]
      - name: payment_mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["NACH", "UPI", "NEFT", "CASH", "CHEQUE"]
      - name: amount_paid
        data_tests: [not_null, not_negative]

  - name: stg_collection_activities
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: activity_at
        data_tests: [not_null]
      - name: activity_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["CALL", "SMS", "FIELD_VISIT", "LEGAL_NOTICE"]
